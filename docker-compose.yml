services:
  app:
    build: .
    image: cosmos-tech:local
    container_name: cosmos-tech-app
    restart: unless-stopped
    environment:
      NODE_ENV: development
      DB_MODE: json
      APP_HOST: 0.0.0.0
      APP_PORT: "3000"
      PORT: "3000"
    ports:
      - "${COSMOS_HOST_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
