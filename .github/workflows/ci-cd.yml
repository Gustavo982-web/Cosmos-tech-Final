

name: CI-CD Cosmos-TECH

on:
  push:
    branches: [ main ]      
  workflow_dispatch: {}     

jobs:
  # CI 
  validar:
    name: CI - Validar aplicacao
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validar sintaxe dos arquivos JS
        run: |
          node --check app.js
          find src -name "*.js" -exec node --check {} \;

      - name: Testar o build da imagem Docker (sem enviar)
        run: docker build -t cosmos-tech:ci-teste .

 
  publicar:
    name: CD - Enviar imagem ao Docker Hub
    runs-on: ubuntu-latest
    needs: validar                      
    if: github.event_name == 'workflow_dispatch'   # trava
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build e push da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/cosmos-tech:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/cosmos-tech:${{ github.sha }}
