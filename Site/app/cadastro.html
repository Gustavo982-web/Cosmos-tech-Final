<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro | Cosmos Tech</title>
    <link rel="stylesheet" href="global.css" />
    <link rel="stylesheet" href="auth.css" />
    <script src="./site-nav.js" defer></script>
  </head>
  <body class="auth-page">
    <video class="auth-background" autoplay muted loop playsinline preload="metadata" aria-hidden="true" tabindex="-1" poster="./Imgs/fundo-de-galaxia-espacial.jpg">
      <source src="./video/213407_small.mp4" type="video/mp4" />
    </video>
    <header class="navbar">
      <div class="logo">
        <img src="./Imgs/ICONE.png" alt="Cosmos Tech Logo" />
        <span><span class="cosmos">COSMOS</span><span class="tech">TECH</span></span>
      </div>
      <nav class="menu">
        <a href="./index.html">Início</a>
        <a href="./software.html">Sistema Solar</a>
        <a href="./viagens.html">Missões</a>
        <a href="./login.html">Entrar</a>
        <a class="active" href="./cadastro.html">Criar conta</a>
      </nav>
    </header>

    <main class="auth-shell">
      <form id="registerForm" class="auth-card" novalidate>
        <h1>Criar conta</h1>
        <div class="field">
          <label for="nome">Nome completo</label>
          <input id="nome" name="nome" type="text" required placeholder="Seu nome" />
        </div>
        <div class="field">
          <label for="username">Username</label>
          <input id="username" name="username" type="text" required placeholder="ex: astro_ana" />
        </div>
        <div class="field">
          <label for="email">E-mail</label>
          <input id="email" name="email" type="email" required placeholder="seu@email.com" />
        </div>
        <div class="field">
          <label for="senha">Senha</label>
          <div class="password-wrap">
            <input id="senha" name="senha" type="password" required placeholder="Mínimo 8 caracteres" />
            <button type="button" class="toggle-password" aria-label="Mostrar ou ocultar senha">Mostrar</button>
          </div>
        </div>
        <button class="primary-btn" type="submit">Cadastrar</button>
        <div id="message" class="message" aria-live="polite"></div>
        <p class="helper">Já tem conta? <a href="login.html">Entrar</a></p>
      </form>
    </main>

    <script>
      const form = document.getElementById("registerForm");
      const message = document.getElementById("message");
      const passwordField = document.getElementById("senha");
      const toggleButton = document.querySelector(".toggle-password");

      toggleButton.addEventListener("click", function () {
        const shouldShow = passwordField.type === "password";
        passwordField.type = shouldShow ? "text" : "password";
        toggleButton.textContent = shouldShow ? "Ocultar" : "Mostrar";
      });

      form.addEventListener("submit", async function (event) {
        event.preventDefault();
        message.textContent = "";

        const payload = {
          nome: document.getElementById("nome").value.trim(),
          username: document.getElementById("username").value.trim(),
          email: document.getElementById("email").value.trim(),
          senha: document.getElementById("senha").value,
        };

        if (!payload.nome || !payload.username || !payload.email || !payload.senha) {
          message.textContent = "Preencha todos os campos.";
          return;
        }

        try {
          const response = await fetch("/usuarios/cadastrar", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });
          const data = await response.json();
          if (!response.ok) {
            throw new Error(data.message || "Não foi possível concluir o cadastro.");
          }

          message.textContent = "Cadastro realizado com sucesso! Redirecionando para login...";
          setTimeout(function () {
            window.location.href = "login.html";
          }, 1200);
        } catch (error) {
          message.textContent = error.message;
        }
      });
    </script>
  </body>
</html>
