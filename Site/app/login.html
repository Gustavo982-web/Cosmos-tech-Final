<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Entrar | Cosmos Tech</title>
    <link rel="stylesheet" href="global.css" />
    <link rel="stylesheet" href="auth.css" />
    <script src="./site-nav.js" defer></script>
  </head>
  <body class="auth-page">
    <video class="auth-background" autoplay muted loop playsinline preload="metadata" aria-hidden="true" tabindex="-1" poster="./Imgs/fundo-de-galaxia-espacial.jpg">
      <source src="./video/213407_small.mp4" type="video/mp4" />
    </video>
    <header class="navbar">
      <div class="logo">
        <img src="./Imgs/ICONE.png" alt="Cosmos Tech Logo" />
        <span><span class="cosmos">COSMOS</span><span class="tech">TECH</span></span>
      </div>
      <nav class="menu" id="mainMenu">
        <a href="./index.html">Início</a>
        <a class="active" href="./login.html">Entrar</a>
        <a href="./cadastro.html">Criar conta</a>
      </nav>
    </header>

    <main class="auth-shell">
      <form id="loginForm" class="auth-card" novalidate>
        <h1>Entrar</h1>
        <div class="field">
          <label for="email">E-mail ou usuário</label>
          <input id="email" name="email" autocomplete="username" required placeholder="seu@email.com ou usuário" />
        </div>
        <div class="field">
          <label for="senha">Senha</label>
          <div class="password-wrap">
            <input id="senha" name="senha" type="password" required placeholder="Sua senha" />
            <button type="button" class="toggle-password" aria-label="Mostrar ou ocultar senha">Mostrar</button>
          </div>
        </div>
        <button class="primary-btn" type="submit">Entrar</button>
        <div id="message" class="message" aria-live="polite"></div>
        <p class="helper">Ainda não tem conta? <a href="cadastro.html">Cadastre-se</a></p>
        <div class="demo-access">
          Testar com a conta demo
          <button id="fillDemo" type="button">Preencher acesso demo</button>
        </div>
      </form>
    </main>

    <script>
      const protectedPages = ["software.html", "viagens.html", "comunidade.html", "jogo.html"];
      const requestedPage = new URLSearchParams(window.location.search).get("redirect");
      const postLoginPage = protectedPages.includes(requestedPage) ? requestedPage : "perfil.html";
      const savedUser = JSON.parse(sessionStorage.getItem("cosmos_user") || "null");
      if (savedUser && savedUser.id) {
        window.location.href = `./${postLoginPage}`;
      }

      const form = document.getElementById("loginForm");
      const message = document.getElementById("message");
      const passwordField = document.getElementById("senha");
      const toggleButton = document.querySelector(".toggle-password");
      const demoButton = document.getElementById("fillDemo");

      demoButton.addEventListener("click", function () {
        document.getElementById("email").value = "demo@cosmostech.local";
        passwordField.value = "cosmos123";
        message.textContent = "Acesso demo preenchido. Clique em Entrar.";
      });

      toggleButton.addEventListener("click", function () {
        const shouldShow = passwordField.type === "password";
        passwordField.type = shouldShow ? "text" : "password";
        toggleButton.textContent = shouldShow ? "Ocultar" : "Mostrar";
      });

      form.addEventListener("submit", async function (event) {
        event.preventDefault();
        message.textContent = "";

        const payload = {
          email: document.getElementById("email").value.trim(),
          senha: document.getElementById("senha").value,
        };

        if (!payload.email || !payload.senha) {
          message.textContent = "Informe e-mail e senha.";
          return;
        }

        try {
          const response = await fetch("/usuarios/autenticar", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });

          const data = await response.json();
          if (!response.ok) {
            throw new Error(data.message || "Falha ao autenticar.");
          }

          sessionStorage.setItem("cosmos_user", JSON.stringify(data.user));
          message.textContent = "Login realizado com sucesso.";
          window.location.href = `./${postLoginPage}`;
        } catch (error) {
          message.textContent = error.message;
        }
      });
    </script>
  </body>
</html>
